global_defs {
    router_id ${NODE_NAME}
    enable_script_security
    script_user root
}

vrrp_script chk_pg {
    script "/usr/local/bin/evl-pg-check"
    interval 2
    timeout 2
    fall 3
    rise 2
}

vrrp_instance EVL_DB {
    state BACKUP
    nopreempt
    interface ${IFACE}
    virtual_router_id ${VRID}
    priority ${DB_PRIORITY}
    advert_int 1
    unicast_src_ip ${NODE_IP}
    unicast_peer {
        ${DB_PEER_IP}
    }
    authentication {
        auth_type PASS
        auth_pass ${VRRP_PASS}
    }
    track_script {
        chk_pg
    }
    notify_master "/usr/local/bin/evl-pg-promote"
}

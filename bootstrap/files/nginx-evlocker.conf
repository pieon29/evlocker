limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

log_format evl '$remote_addr - [$time_iso8601] "$request" $status $body_bytes_sent '
               'rt=$request_time urt=$upstream_response_time node=$hostname';

upstream evl_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 127.0.0.1:8080;
    location = /stub_status {
        stub_status;
    }
}

server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        proxy_pass http://evl_app;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name ${APP_DOMAIN} _;

    ssl_certificate     /etc/evlocker/tls/server.crt;
    ssl_certificate_key /etc/evlocker/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    server_tokens off;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    access_log /var/log/nginx/access.log evl;
    access_log syslog:server=unix:/dev/log,tag=nginx_access,severity=info evl;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;

    location = /metrics {
        allow ${MGMT_CIDR};
        deny all;
        proxy_pass http://evl_app;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://evl_app;
    }

    location / {
        proxy_pass http://evl_app;
    }
}

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  CONFTEST_IMAGE: openpolicyagent/conftest:v0.56.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2

jobs:
  iac:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0

      - name: tflint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: trivy config
        run: docker run --rm -v "$GITHUB_WORKSPACE":/src:ro "$TRIVY_IMAGE" config --exit-code 1 --severity HIGH,CRITICAL /src

      - name: checkov
        run: |
          pip install --quiet checkov==3.4.10
          checkov -d . --framework terraform --compact --quiet

      - name: policy tests
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/w:ro -w /w "$CONFTEST_IMAGE" test --policy terraform/policy tests/policy/plan-good.json
          if docker run --rm -v "$GITHUB_WORKSPACE":/w:ro -w /w "$CONFTEST_IMAGE" test --policy terraform/policy tests/policy/plan-bad.json; then
            echo "bad plan was not rejected"; exit 1
          fi

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD":/repo "$GITLEAKS_IMAGE" detect --source /repo --redact --verbose

  app:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: init database
        run: |
          psql -v ON_ERROR_STOP=1 -v app_pw=ci-app -v repl_pw=ci-repl -v backup_pw=ci-backup -f bootstrap/files/db-init.sql
          psql -v ON_ERROR_STOP=1 -d evlocker -f app/schema.sql
      - name: unit tests
        env:
          TEST_DATABASE_URL: host=localhost user=evl_app password=ci-app dbname=evlocker
          TEST_OWNER_DATABASE_URL: host=localhost user=postgres password=ci-only-password dbname=evlocker
        run: |
          pip install --quiet -r app/requirements.txt -r app/requirements-dev.txt
          pytest -q tests

  image:
    runs-on: ubuntu-24.04
    needs: [iac, secrets, app]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: build
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/evlocker:sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          docker build --build-arg APP_VERSION="sha-${GITHUB_SHA::7}" -t evlocker:ci app
      - name: trivy image
        run: |
          docker save evlocker:ci -o image.tar
          docker run --rm -v "$PWD":/work:ro "$TRIVY_IMAGE" image --input /work/image.tar --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          docker run --rm -v "$PWD":/work:ro "$TRIVY_IMAGE" image --input /work/image.tar --scanners vuln --severity HIGH,CRITICAL
      - name: push
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag evlocker:ci "$IMAGE"
          docker push "$IMAGE"
          echo "pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
